[tool.poetry]
name = "fxt-lead-intelligence"
version = "0.1.0"
description = "Pipeline to identify companies facing warehouse densification constraints"
authors = ["FXT Team"]
readme = "README.md"
packages = [
    { include = "ingestion" },
    { include = "crawling" },
    { include = "parsing" },
    { include = "signals" },
    { include = "scoring" },
    { include = "ai" },
    { include = "storage" },
    { include = "utils" },
]

[tool.poetry.dependencies]
python = "^3.11"

# HTTP & crawling
httpx = "^0.27"
playwright = "^1.44"
beautifulsoup4 = "^4.12"
lxml = "^5.2"

# AI / LLM
anthropic = "^0.28"
# openai and tiktoken are not yet used; add when a second provider is integrated

# Data models & validation
pydantic = "^2.7"
pydantic-settings = "^2.3"

# Storage
sqlalchemy = "^2.0"
alembic = "^1.13"
psycopg2-binary = "^2.9"  # Postgres driver

# Resilience
tenacity = "^8.3"         # retry logic with exponential back-off

# Utilities
structlog = "^24.1"
rich = "^13.7"            # CLI output

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
mypy = "^1.10"
ruff = "^0.4"
types-beautifulsoup4 = "^4.12"

[tool.poetry.scripts]
pipeline = "main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
